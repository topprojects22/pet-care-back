apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-care-backend
  labels:
    app: pet-care-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pet-care-backend
  template:
    metadata:
      labels:
        app: pet-care-backend
    spec:
      containers:
      - name: app
        image: pet-care-backend:latest
        ports:
        - containerPort: 5000
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: pet-care-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: pet-care-secrets
              key: jwt-secret
        - name: REDIS_HOST
          value: "redis-service"
        - name: USE_REDIS
          value: "true"
        - name: ENABLE_FILE_LOGGING
          value: "true"
        - name: METRICS_ENABLED
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health/liveness
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health/readiness
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pet-care-backend-service
spec:
  selector:
    app: pet-care-backend
  ports:
  - name: http
    port: 80
    targetPort: 5000
  - name: metrics
    port: 9090
    targetPort: 9090
  type: LoadBalancer

