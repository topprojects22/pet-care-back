apiVersion: v1
kind: ConfigMap
metadata:
  name: pet-care-config
data:
  NODE_ENV: "production"
  PORT: "5000"
  API_PREFIX: "api"
  CACHE_TTL: "300"
  REDIS_TTL: "3600"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  ENABLE_FILE_LOGGING: "true"
  LOG_DIRECTORY: "/app/logs"
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  RATE_LIMIT_TTL: "60"
  RATE_LIMIT_MAX: "100"

